# main 브랜치에 push 하면 → 자동으로 빌드 → GitHub Pages에 올림
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # GitHub 화면에서 수동 실행도 가능

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci            # package-lock.json 그대로 설치
      - run: npm run build     # → dist/ 폴더 생성
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
